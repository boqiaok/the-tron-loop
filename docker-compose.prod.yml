services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    mem_limit: 64m

  server:
    image: ghcr.io/boqiaok/the-tron-loop-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      MEDIA_STORAGE_PATH: /app/media
      WEB_ORIGIN: https://${SITE_DOMAIN}
      PUBLIC_API_URL: https://${SITE_DOMAIN}
      ADMIN_COOKIE_SECURE: "true"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m

  web:
    image: ghcr.io/boqiaok/the-tron-loop-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://server:3001/api/v1
    mem_limit: 384m

volumes:
  caddy_data:
  caddy_config:
  media_data:
