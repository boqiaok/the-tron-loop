x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/caddy/cloudflare-origin-pull-ca.pem:/etc/caddy/cloudflare-origin-pull-ca.pem:ro
      - ./infrastructure/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    mem_limit: 128m
    logging: *logging

  server:
    image: ghcr.io/boqiaok/the-tron-loop-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: https://${SITE_DOMAIN}
      PUBLIC_API_URL: https://${SITE_DOMAIN}
      ADMIN_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    logging: *logging

  web:
    image: ghcr.io/boqiaok/the-tron-loop-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://server:3001/api/v1
    mem_limit: 384m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
