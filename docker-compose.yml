services:
  database:
    image: postgres:18-alpine
    container_name: the-tron-loop-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_tron_loop
      POSTGRES_USER: tron_loop
      POSTGRES_PASSWORD: tron_loop_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tron_loop -d the_tron_loop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: