services:
  database:
    image: postgres:18-alpine
    container_name: the-tron-loop-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_tron_loop
      POSTGRES_USER: tron_loop
      POSTGRES_PASSWORD: tron_loop_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tron_loop -d the_tron_loop"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: the-tron-loop-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
      MEDIA_STORAGE_PATH: /app/media
      ADMIN_COOKIE_SECURE: "false"
      IMPORTS_ENABLED: "true"
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: tron_loop
      DB_PASSWORD: tron_loop_dev
      DB_DATABASE: the_tron_loop
    ports:
      - "3001:3001"
    volumes:
      - media_data:/app/media
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    container_name: the-tron-loop-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://server:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
